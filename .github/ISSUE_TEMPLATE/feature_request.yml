name: Feature request
description: Suggest an improvement or new capability for RevScope.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or gap does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like RevScope to solve it?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Vehicle / adapter context
      description: Any vehicle, adapter, or protocol details that matter.
      placeholder: "Renault Kardian · Vgate iCar Pro 2S · BLE"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or apps that already do this.
    validations:
      required: false
