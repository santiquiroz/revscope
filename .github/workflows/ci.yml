name: CI

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: i18n guards
        run: |
          python scripts/i18n/parity.py app core/* feature/* wear
          python scripts/i18n/hardcoded.py app core feature wear

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Roborazzi screenshots are recorded on Windows; they are verified locally with verifyRoborazziDebug, not on Linux CI (font rendering differs).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --continue --console=plain --stacktrace

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: revscope-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
