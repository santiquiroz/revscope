[versions]
agp = "8.9.0"
kotlin = "2.0.21"
composeBom = "2025.05.00"
activityCompose = "1.10.1"
navigationCompose = "2.8.9"
hilt = "2.56.2"
hiltNavigationCompose = "1.2.0"
androidxHiltWork = "1.2.0"
workManager = "2.9.1"
room = "2.7.1"
datastore = "1.1.4"
coroutines = "1.9.0"
blessed = "0.4.2"
vico = "2.1.2"
exp4j = "0.4.8"
timber = "5.0.1"
junit = "4.13.2"
mockk = "1.13.12"
androidxTestExt = "1.2.1"
orgJson = "20231013"
lifecycleViewmodel = "2.8.7"
carApp = "1.4.0"
securityCrypto = "1.1.0-alpha06"
wearCompose = "1.4.0"
healthServices = "1.0.0"
playServicesWearable = "18.2.0"
guava = "33.0.0-android"
androidxCoreKtx = "1.13.1"
nanohttpd = "2.3.1"
okhttp = "4.12.0"
maplibre = "13.4.1"
maplibreTurf = "6.0.1"

[libraries]
# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHiltWork" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Encrypted storage (API keys)
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Wear OS
wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
health-services = { group = "androidx.health", name = "health-services-client", version.ref = "healthServices" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
guava-android = { group = "com.google.guava", name = "guava", version.ref = "guava" }

# Motor de mapas vectoriales. Variante OpenGL a propósito: desde 13.0.0 el
# artefacto por defecto usa Vulkan, cuyo paquete filtra dispositivos por
# android.hardware.vulkan.version y tiene un fix pendiente de release para
# VK_ERROR_DEVICE_LOST en Adreno 600 con el indicador de ubicación.
maplibre = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibre" }

# Turf viaja como transitiva del SDK pero solo en el classpath de runtime, así que hay
# que declararla para compilar contra TurfTransformation.circle (círculos en metros).
maplibre-turf = { group = "org.maplibre.gl", name = "android-sdk-turf", version.ref = "maplibreTurf" }

coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# BLE
blessed-android = { group = "com.github.weliem", name = "blessed-android-coroutines", version.ref = "blessed" }

# Charts
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# Formula evaluation
exp4j = { group = "net.objecthunter", name = "exp4j", version.ref = "exp4j" }

# Timber
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
androidx-test-ext = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
# org.json on JVM for unit tests (Android runtime provides this on device)
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

# Lifecycle ViewModel
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodel" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleViewmodel" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewmodel" }

# Android Auto (Car App Library)
car-app = { group = "androidx.car.app", name = "app", version.ref = "carApp" }

# AndroidX Core (FileProvider for CSV export sharing)
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }

# Embedded HTTP server (local-network MCP server)
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }

# WebSocket client (rodadas en grupo contra revscope-server)
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
