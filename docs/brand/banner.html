<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280" />
  <title>RevScope — Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1280px;
      height: 640px;
      overflow: hidden;
      margin: 0;
    }

    body {
      position: relative;
      background-color: #0A0A0F;
      background-image:
        radial-gradient(ellipse 95% 90% at 50% 50%, transparent 42%, rgba(0, 0, 0, 0.72) 100%),
        radial-gradient(circle 420px at 880px 320px, rgba(232, 255, 0, 0.10), transparent 100%),
        linear-gradient(rgba(232, 255, 0, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 255, 0, 0.045) 1px, transparent 1px);
      background-size: auto, auto, 32px 32px, 32px 32px;
      background-repeat: no-repeat, no-repeat, repeat, repeat;
      font-family: "Space Grotesk", sans-serif;
      color: #F0F0F8;
    }

    .copy {
      position: absolute;
      left: 72px;
      top: 50%;
      transform: translateY(-50%);
      width: 560px;
      max-width: calc(640px - 72px);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.22em;
      color: #9097B0;
      text-transform: uppercase;
    }

    .wordmark {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 104px;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .wordmark .rev { color: #F0F0F8; }

    .wordmark .scope {
      color: #E8FF00;
      text-shadow: 0 0 24px rgba(232, 255, 0, 0.35);
    }

    .tagline {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 500;
      font-size: 30px;
      line-height: 1.25;
      color: #F0F0F8;
      max-width: 540px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 540px;
    }

    .pill {
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 14px;
      color: #F0F0F8;
      padding: 8px 14px;
      border: 1px solid rgba(232, 255, 0, 0.35);
      border-radius: 999px;
      background: rgba(28, 28, 40, 0.7);
      white-space: nowrap;
    }

    .footer-line {
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 18px;
      color: #E8FF00;
      margin-top: 6px;
    }

    .tach {
      position: absolute;
      left: 620px;
      top: 40px;
      width: 520px;
      height: 520px;
      z-index: 0;
      pointer-events: none;
    }

    .phones {
      position: absolute;
      left: 880px;
      top: 64px;
      width: 0;
      height: 0;
      z-index: 1;
    }

    .phone {
      position: absolute;
      left: 0;
      top: 0;
      box-sizing: content-box;
      width: 236px;
      height: 511px;
      margin-left: -124px; /* center framed phone (236 + 2×6 border) on 880 */
      border-radius: 34px;
      border: 6px solid #1C1C28;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(232, 255, 0, 0.12);
      overflow: hidden;
      background: #1C1C28;
    }

    .phone img {
      display: block;
      width: 236px;
      height: 511px;
      object-fit: cover;
      border-radius: 28px;
    }

    .phone-center {
      z-index: 3;
      transform: none;
    }

    .phone-left {
      z-index: 2;
      transform: translate(-150px, 40px) rotate(-8deg) scale(0.86);
      filter: brightness(0.75);
    }

    .phone-right {
      z-index: 1;
      transform: translate(150px, 40px) rotate(8deg) scale(0.86);
      filter: brightness(0.75);
    }
  </style>
</head>
<body>
  <div class="copy">
    <div class="eyebrow">OPEN SOURCE · ANDROID · OBD2</div>
    <div class="wordmark"><span class="rev">Rev</span><span class="scope">Scope</span></div>
    <p class="tagline">Turn your phone into your motorcycle's or car's trip computer.</p>
    <div class="pills">
      <span class="pill">Live telemetry</span>
      <span class="pill">Workshop diagnostics</span>
      <span class="pill">Track mode</span>
      <span class="pill">Crash detection</span>
      <span class="pill">AI optional</span>
    </div>
    <div class="footer-line">Free  ·  No ads  ·  No account  ·  English / Español</div>
  </div>

    </g>
  </svg>

  <div class="phones">
    <div class="phone phone-left">
      <img src="../screenshots/taller.png" alt="Workshop diagnostics" width="236" height="511" />
    </div>
    <div class="phone phone-right">
      <img src="../screenshots/mapa.png" alt="Live map" width="236" height="511" />
    </div>
    <div class="phone phone-center">
      <img src="../screenshots/conducir.png" alt="Drive mode" width="236" height="511" />
    </div>
  </div>
</body>
</html>
